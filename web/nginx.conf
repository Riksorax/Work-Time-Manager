server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Branding-Dateien im Root (#437): feste Dateinamen ohne Content-Hash, deshalb kein Langzeit-Cache.
    # Muss VOR der Bundle-Location stehen (nginx nimmt die erste passende Regex-Location). Mit ETag/Last-Modified
    # revalidiert der Browser (304). Die Query ?v=170 in index.html/Manifest holt zusätzlich Bestandsnutzer ab.
    location ~* ^/(favicon(-\d+x\d+)?\.(ico|png|svg)|apple-touch-icon\.png|icon-(maskable-)?\d+x\d+\.png|og-image\.png|logo\.svg)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        # add_header in einer Location ersetzt die geerbten Header, deshalb hier wiederholt.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        access_log off;
    }

    # Statische Assets langfristig cachen (Content-Hash im Dateinamen)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # manifest.json nicht cachen (PWA-Aktualisierungen)
    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Sicherheits-Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/wasm;
}
