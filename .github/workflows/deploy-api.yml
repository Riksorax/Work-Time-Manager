name: API — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/work-time-manager-api

jobs:
  # ── 1. .NET Build & Test ─────────────────────────────────────────────────────
  build:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WorkTimeManager.slnx

      - name: Build
        run: dotnet build WorkTimeManager.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WorkTimeManager.slnx --no-build --configuration Release

  # ── 2. Docker Image bauen & in Docker Hub pushen ────────────────────────────
  docker:
    name: Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build & Push Docker Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Hetzner Deploy (main) ─────────────────────────────────────────────────
  deploy:
    name: Deploy → Hetzner
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version Tag
        id: vars
        run: |
          # Nur den Teil nach dem letzten Doppelpunkt extrahieren (den Tag)
          FULL_TAG=$(echo "${{ needs.docker.outputs.image-tag }}" | tr ',' '\n' | grep -E '[0-9]{8}-[0-9]{6}' | head -n 1)
          TAG=$(echo $FULL_TAG | awk -F':' '{print $NF}')
          echo "deploy_tag=$TAG" >> $GITHUB_OUTPUT

      - name: docker-compose.yml auf Server kopieren
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.HETZNER_HOST }}
          username: ${{ vars.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          source:   server/docker-compose.yml
          target:   ~/projekte/work-time-manager
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_DOCKER_TAG: ${{ steps.vars.outputs.deploy_tag }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          host:     ${{ vars.HETZNER_HOST }}
          username: ${{ vars.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          envs:     API_DOCKER_TAG,FIREBASE_PROJECT_ID,FIREBASE_SERVICE_ACCOUNT_BASE64
          script: |
            set -e
            cd ~/projekte/work-time-manager
            echo "Deploying version: $API_DOCKER_TAG"

            # Neues Image ziehen
            docker compose pull work-time-manager-api

            # Container starten/aktualisieren (Firebase-Env-Vars kommen aus der Pipeline)
            docker compose up -d --no-deps work-time-manager-api

            # Alte Images aufräumen
            docker image prune -f
