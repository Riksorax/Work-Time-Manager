name: Android Emulator – Timer-Aktionen von außen

# Prüft auf einem echten Android-Emulator (KVM), was Unit-Tests nicht erreichen: Assistant-Intents (#280)
# und Notification-Aktionen mit und ohne laufende App (#485). Läuft manuell und bei Änderungen an den
# beteiligten Dateien. Braucht das Secret GOOGLE_SERVICES_JSON (wie flutter-production.yml), daher nicht
# für Fork-PRs.
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - 'mobile/android/**'
      - 'mobile/lib/core/services/timer_action*.dart'
      - 'mobile/lib/core/services/headless_timer_action.dart'
      - 'mobile/lib/core/services/notification_service.dart'
      - 'mobile/lib/domain/utils/timer_action.dart'
      - 'mobile/lib/presentation/view_models/timer_action_view_model.dart'
      - 'mobile/tool/android_e2e/**'
      - '.github/workflows/android-emulator.yml'

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator-Test (Timer-Aktionen)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Gleiches SDK wie flutter-production.yml / ci.yml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.49.0-0.2.pre'
          channel: 'beta'
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create google-services.json
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON fehlt (Fork-PR?)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/tool/android_e2e/run.sh mobile/build/app/outputs/flutter-apk/app-debug.apk
