name: CI — Build & Test

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter-Version bewusst fest gepinnt statt 'stable' mitwandern zu lassen.
      # Die exakten Overrides für test_api/test_core in mobile/pubspec.yaml sind an
      # die test_api-Version gekoppelt, die das flutter_test dieses SDKs verlangt.
      # Beim Anheben hier müssen die Overrides mitgezogen werden.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  web:
    name: Angular Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create CI environment.ts
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            buildTimestamp: 'ci',
            apiUrl: 'http://localhost:5000',
            firebase: {
              apiKey: 'ci-dummy',
              authDomain: 'ci-dummy.firebaseapp.com',
              projectId: 'ci-dummy',
              storageBucket: 'ci-dummy.appspot.com',
              messagingSenderId: '000000000000',
              appId: '1:000000000000:web:0000000000000000',
              measurementId: 'G-XXXXXXXXXX',
            },
            rcWebApiKey: 'ci-dummy',
          };
          EOF
          cp src/environments/environment.ts src/environments/environment.prod.ts

      # --watch=false erzwingen: der Builder würde sonst in einer TTY in den
      # Watch-Modus gehen und den Job hängen lassen.
      - name: Test
        run: npm test -- --watch=false

      - name: Build check
        run: |
          rm -rf .angular/cache
          npm run build -- --configuration production --delete-output-path

  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WorkTimeManager.slnx

      - name: Build
        run: dotnet build WorkTimeManager.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WorkTimeManager.slnx --no-build --configuration Release
