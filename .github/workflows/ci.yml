name: CI — Build & Test

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter-Version bewusst fest gepinnt statt 'stable' mitwandern zu lassen.
      # Die exakten Overrides für test_api/test_core in mobile/pubspec.yaml sind an
      # die test_api-Version gekoppelt, die das flutter_test dieses SDKs verlangt.
      # Beim Anheben hier müssen die Overrides mitgezogen werden.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # riverpod_lint über custom_lint - flutter analyze sieht diese Regeln nicht.
      - name: Custom Lint
        run: dart run custom_lint

      - name: Test
        run: flutter test

      # Ganze Suite unter Zeitzone mit Zeitumstellung (#362)
      - name: Test (TZ=Europe/Berlin)
        run: TZ=Europe/Berlin flutter test

      # Westlich von UTC fällt UTC-Mitternacht auf den Vortag (#418); nur die
      # Zonen-Regressionstests (*_tz_test.dart), nicht die ganze Suite. Die
      # Zone kommt ausschließlich über TZ; der Canary in jeder Datei schlägt
      # an, falls TZ nicht wirkt (z. B. fehlende tzdata, dann liefe es still in UTC).
      - name: Test (TZ=America/Los_Angeles, Pacific/Auckland)
        run: |
          files=$(find test -name '*_tz_test.dart' | sort)
          if [ -z "$files" ]; then
            echo "Keine *_tz_test.dart gefunden" >&2
            exit 1
          fi
          for tz in America/Los_Angeles Pacific/Auckland; do
            TZ=$tz flutter test $files
          done

  web:
    name: Angular Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create CI environment.ts
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            buildTimestamp: 'ci',
            apiUrl: 'http://localhost:5000',
            firebase: {
              apiKey: 'ci-dummy',
              authDomain: 'ci-dummy.firebaseapp.com',
              projectId: 'ci-dummy',
              storageBucket: 'ci-dummy.appspot.com',
              messagingSenderId: '000000000000',
              appId: '1:000000000000:web:0000000000000000',
              measurementId: 'G-XXXXXXXXXX',
            },
            rcWebApiKey: 'ci-dummy',
            sentryDsn: '',
          };
          EOF
          cp src/environments/environment.ts src/environments/environment.prod.ts

      # --watch=false erzwingen: der Builder würde sonst in einer TTY in den
      # Watch-Modus gehen und den Job hängen lassen.
      - name: Test
        run: npm test -- --watch=false

      # Sommerzeit-Fehler (z. B. #355) sind unter UTC unsichtbar.
      - name: Test (TZ=Europe/Berlin)
        run: TZ=Europe/Berlin npm test -- --watch=false

      # Westlich von UTC fällt UTC-Mitternacht auf den Vortag (#407); nur die Zonen-Regressionstests (*.tz.spec.ts).
      # Ohne Treffer bricht der Builder mit Fehler ab (kein stiller Vollauf, kein grüner Leerlauf).
      - name: Test (TZ=America/Los_Angeles, Pacific/Auckland)
        run: |
          for tz in America/Los_Angeles Pacific/Auckland; do
            TZ=$tz npm test -- --watch=false --include 'src/**/*.tz.spec.ts'
          done

      - name: Build check
        run: |
          rm -rf .angular/cache
          npm run build -- --configuration production --delete-output-path

  e2e:
    name: Web UI-Tests (Playwright, ${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, edge, mobile-chrome, mobile-safari]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Edge kommt als eigener Kanal, die übrigen Projekte nutzen die
      # Playwright-eigenen Browser (#429).
      - name: Install browser
        run: |
          if [ "${{ matrix.project }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          elif [ "${{ matrix.project }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ matrix.project }}" = "webkit" ] || [ "${{ matrix.project }}" = "mobile-safari" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi

      # Tests mit Konto (Profilwechsel u. a.) laufen nur in Chromium gegen die Firebase-Emulatoren (Java 21 nötig).
      - uses: actions/setup-java@v4
        if: matrix.project == 'chromium'
        with:
          distribution: temurin
          java-version: '21'

      - name: UI-Tests
        env:
          E2E_EMULATORS: ${{ matrix.project == 'chromium' && '1' || '0' }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: web/playwright-report
          retention-days: 7

  functions:
    name: Cloud Functions Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/functions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/functions/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WorkTimeManager.slnx

      - name: Build
        run: dotnet build WorkTimeManager.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WorkTimeManager.slnx --no-build --configuration Release
