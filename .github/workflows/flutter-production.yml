name: Flutter Android – Production Build

on:
  push:
    branches:
      - main
  # Manuell auslösbar, um den AAB-Build auf einem Branch zu verifizieren,
  # bevor er nach main geht. Der Play-Upload bleibt dabei aus (siehe unten).
  workflow_dispatch:

defaults:
  run:
    working-directory: ./mobile

jobs:
  build:
    name: Build & Deploy Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Der Release-Name für den Play-Store steht in RELEASE_NAMES.md, gepflegt
      # von version-bump.yml. Der Branch-Name des Release-Zweigs ist hier nicht
      # mehr verfügbar, weil dieser Workflow auf main läuft.
      # Bewusst früh, damit ein fehlender Name nicht erst nach ~9 min Build auffällt.
      - name: Release-Namen ermitteln
        id: release_name
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          CHARACTER=$(awk -F'|' -v v="$VERSION" '
            /^\|/ {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $3)
              if ($2 == v) { print $3; exit }
            }' RELEASE_NAMES.md)

          case "$CHARACTER" in ""|"—"*)
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::Für Version $VERSION steht kein Charakter in RELEASE_NAMES.md. Der Release-Branch muss release/v$VERSION-<Charakter> heißen, damit version-bump.yml den Namen einträgt."
              exit 1
            fi
            echo "::warning::Kein Release-Name für Version $VERSION — bei diesem Testlauf ohne Play-Upload unkritisch."
            exit 0
            ;;
          esac

          echo "name=$VERSION $CHARACTER" >> "$GITHUB_OUTPUT"
          echo "Release-Name: $VERSION $CHARACTER"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Fest gepinnt und identisch zu ci.yml gehalten: der Release-Build muss
      # mit demselben SDK laufen, gegen das die Tests in CI grün sind.
      # Die exakten Overrides für test_api/test_core in mobile/pubspec.yaml sind
      # an die test_api-Version dieses SDKs gekoppelt und beim Anheben mitzuziehen.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Keystore ist leer oder fehlt – ANDROID_KEYSTORE_BASE64 prüfen!"
            exit 1
          fi

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Build Production AAB
        env:
          ORG_GRADLE_PROJECT_android.signing.storeFile: release.keystore
          ORG_GRADLE_PROJECT_android.signing.storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.signing.keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.signing.keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=$(( ${{ github.run_number }} + 1393 )) \
            --dart-define=API_URL="https://api.work-time-manager.app" \
            --dart-define=RC_ANDROID_KEY="${{ secrets.RC_ANDROID_PROD_KEY }}" \
            --dart-define=RECAPTCHA_SITE_KEY="${{ secrets.RECAPTCHA_SITE_KEY }}"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-production-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Nur beim echten Release über main hochladen. Ein manueller Testlauf
      # (workflow_dispatch) baut das AAB, veröffentlicht es aber nicht.
      - name: Upload to Google Play (Closed Testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: app.work_time_manager
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.release_name.outputs.name }}
          tracks: alpha
          status: completed
