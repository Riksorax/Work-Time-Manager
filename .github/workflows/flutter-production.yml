name: Flutter Android – Production Build

on:
  push:
    branches:
      - main
  # Manuell auslösbar, um den AAB-Build auf einem Branch zu verifizieren,
  # bevor er nach main geht. Der Play-Upload bleibt dabei aus (siehe unten).
  workflow_dispatch:
    inputs:
      track_name:
        description: 'Google Play Track / Release Name (optional, überschreibt RELEASE_NAMES.md)'
        required: false
        default: ''

defaults:
  run:
    working-directory: ./mobile

jobs:
  build:
    name: Build & Deploy Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Der Release- und Track-Name für den Play-Store steht in RELEASE_NAMES.md, gepflegt
      # von version-bump.yml. Der Branch-Name des Release-Zweigs ist hier nicht
      # mehr verfügbar, weil dieser Workflow auf main läuft.
      # Bewusst früh, damit ein fehlender Name nicht erst nach ~9 min Build auffällt.
      - name: Release- und Track-Namen ermitteln
        id: release_name
        working-directory: .
        run: |
          OVERRIDE="${{ github.event.inputs.track_name }}"
          if [ -n "$OVERRIDE" ]; then
            echo "name=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "track=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Release- und Track-Name (aus Input): $OVERRIDE"
            exit 0
          fi

          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          CHARACTER=$(awk -F'|' -v v="$VERSION" '
            /^\|/ {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $3)
              if ($2 == v) { print $3; exit }
            }' RELEASE_NAMES.md)

          case "$CHARACTER" in ""|"—"*)
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::Für Version $VERSION steht kein Charakter in RELEASE_NAMES.md. Der Release-Branch muss release/v$VERSION-<Charakter> heißen, damit version-bump.yml den Namen einträgt."
              exit 1
            fi
            echo "::warning::Kein Release-Name für Version $VERSION — bei diesem Testlauf ohne Play-Upload unkritisch."
            exit 0
            ;;
          esac

          # Ab 1.6 gibt es einen Track pro Minor-Linie ("1.6 Saix", gilt für 1.6.0,
          # 1.6.1, ...); der Release-Name behält die volle Version ("1.6.1 Saix").
          # Ältere Versionen: Track und Release-Name sind beide "<Version> <Charakter>".
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          TRACK="$VERSION $CHARACTER"
          if [ "$MAJOR" -gt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -ge 6 ]; }; then
            TRACK="$MAJOR.$MINOR $CHARACTER"
          fi

          echo "name=$VERSION $CHARACTER" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "Release-Name: $VERSION $CHARACTER — Track: $TRACK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Fest gepinnt und identisch zu ci.yml gehalten: der Release-Build muss
      # mit demselben SDK laufen, gegen das die Tests in CI grün sind.
      # Die exakten Overrides für test_api/test_core in mobile/pubspec.yaml sind
      # an die test_api-Version dieses SDKs gekoppelt und beim Anheben mitzuziehen.
      # Vorübergehend Beta 3.49.0-0.2.pre wegen flutter/flutter#192231 (siehe ci.yml, #453).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.49.0-0.2.pre'
          channel: 'beta'
          cache: true

      # Ein RevenueCat-Test-Store-Key (`test_...`) lässt im Release-Build
      # Purchases.configure scheitern und die App abstürzen (#454, #455).
      - name: Check RevenueCat key
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_PROD_KEY }}
        run: |
          if [ -z "$RC_ANDROID_KEY" ]; then
            echo "::error::Secret RC_ANDROID_PROD_KEY ist leer oder fehlt – ohne Key startet RevenueCat nicht."
            exit 1
          fi
          case "$RC_ANDROID_KEY" in
            test_*)
              echo "::error::RC_ANDROID_PROD_KEY ist ein Test-Store-Key (test_...). Für den Release-Build den Play-Store-Key (goog_...) aus dem RevenueCat-Dashboard hinterlegen."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Keystore ist leer oder fehlt – ANDROID_KEYSTORE_BASE64 prüfen!"
            exit 1
          fi

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Build Production AAB
        env:
          ORG_GRADLE_PROJECT_android.signing.storeFile: release.keystore
          ORG_GRADLE_PROJECT_android.signing.storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.signing.keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.signing.keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=$(( ${{ github.run_number }} + 1393 )) \
            --dart-define=API_URL="https://api.work-time-manager.app" \
            --dart-define=RC_ANDROID_KEY="${{ secrets.RC_ANDROID_PROD_KEY }}" \
            --dart-define=RECAPTCHA_SITE_KEY="${{ secrets.RECAPTCHA_SITE_KEY }}"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-production-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Diagnose (#467): zusammengefuehrte R8-Regeln samt Herkunft, Seeds und entfernter Code.
      - name: Upload R8 diagnostics Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-r8-diagnostics-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/mapping/release/configuration.txt
            mobile/build/app/outputs/mapping/release/seeds.txt
            mobile/build/app/outputs/mapping/release/usage.txt
          if-no-files-found: warn
          retention-days: 30

      # R8-Guard (#467): `-dontoptimize` in der zusammengefuehrten Konfiguration schaltet die
      # Optimierung fuer die ganze App ab (Play Vitals: 0 %). Bekannte Quelle war die
      # Consumer-Regel von purchases-store-amazon (transitiv ueber purchases_flutter).
      - name: Guard - R8 optimization must not be disabled
        run: |
          CONFIG=build/app/outputs/mapping/release/configuration.txt
          if [ ! -s "$CONFIG" ]; then
            echo "::error::$CONFIG fehlt oder ist leer - R8 lief nicht (minifyEnabled?)."
            exit 1
          fi
          if grep -n -E '^[[:space:]]*-dontoptimize' "$CONFIG"; then
            echo "::error::-dontoptimize in $CONFIG - eine Consumer-Regel schaltet die R8-Optimierung ab (#467). Herkunft steht in den Kommentaren oberhalb des Treffers (Artefakt r8-diagnostics); bekannter Verursacher purchases-store-amazon (Exclude in android/app/build.gradle)."
            exit 1
          fi
          echo "Kein -dontoptimize in der R8-Konfiguration."

      # Die Play Console bietet die mapping.txt nur zum Hochladen/Löschen an. Zum
      # Auflösen obfuskierter Namen (z. B. `z2` in #453) hier als Artefakt ablegen.
      - name: Upload R8 mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-mapping-${{ github.run_number }}
          path: mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # Nur beim echten Release über main hochladen. Ein manueller Testlauf
      # (workflow_dispatch) baut das AAB, veröffentlicht es aber nicht.
      - name: Upload to Google Play (Closed Testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: app.work_time_manager
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.release_name.outputs.name }}
          track: ${{ steps.release_name.outputs.track }}
          status: completed
          whatsNewDirectory: mobile/whatsnew
