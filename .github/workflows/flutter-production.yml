name: Flutter Android – Production Build

on:
  push:
    branches:
      - main
  # Manuell auslösbar, um den AAB-Build auf einem Branch zu verifizieren,
  # bevor er nach main geht. Der Play-Upload bleibt dabei aus (siehe unten).
  workflow_dispatch:
    inputs:
      track_name:
        description: 'Google Play Track / Release Name (optional, überschreibt RELEASE_NAMES.md)'
        required: false
        default: ''
      sync_store_metadata:
        description: 'Store-Metadaten (fastlane/metadata/android) zu Google Play synchronisieren'
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: ./mobile

jobs:
  build:
    name: Build & Deploy Production AAB
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.sync_store_metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Der Release- und Track-Name für den Play-Store steht in RELEASE_NAMES.md, gepflegt
      # von version-bump.yml. Der Branch-Name des Release-Zweigs ist hier nicht
      # mehr verfügbar, weil dieser Workflow auf main läuft.
      # Bewusst früh, damit ein fehlender Name nicht erst nach ~9 min Build auffällt.
      - name: Release- und Track-Namen ermitteln
        id: release_name
        working-directory: .
        run: |
          OVERRIDE="${{ github.event.inputs.track_name }}"
          if [ -n "$OVERRIDE" ]; then
            echo "name=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "track=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Release- und Track-Name (aus Input): $OVERRIDE"
            exit 0
          fi

          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          CHARACTER=$(awk -F'|' -v v="$VERSION" '
            /^\|/ {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $3)
              if ($2 == v) { print $3; exit }
            }' RELEASE_NAMES.md)

          case "$CHARACTER" in ""|"—"*)
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::Für Version $VERSION steht kein Charakter in RELEASE_NAMES.md. Der Release-Branch muss release/v$VERSION-<Charakter> heißen, damit version-bump.yml den Namen einträgt."
              exit 1
            fi
            echo "::warning::Kein Release-Name für Version $VERSION — bei diesem Testlauf ohne Play-Upload unkritisch."
            exit 0
            ;;
          esac

          # Ab 1.6 gibt es einen Track pro Minor-Linie ("1.6 Saix", gilt für 1.6.0,
          # 1.6.1, ...); der Release-Name behält die volle Version ("1.6.1 Saix").
          # Ältere Versionen: Track und Release-Name sind beide "<Version> <Charakter>".
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          TRACK="$VERSION $CHARACTER"
          if [ "$MAJOR" -gt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -ge 6 ]; }; then
            TRACK="$MAJOR.$MINOR $CHARACTER"
          fi

          echo "name=$VERSION $CHARACTER" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "Release-Name: $VERSION $CHARACTER — Track: $TRACK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Fest gepinnt und identisch zu ci.yml gehalten: der Release-Build muss
      # mit demselben SDK laufen, gegen das die Tests in CI grün sind.
      # Die exakten Overrides für test_api/test_core in mobile/pubspec.yaml sind
      # an die test_api-Version dieses SDKs gekoppelt und beim Anheben mitzuziehen.
      # Vorübergehend Beta 3.49.0-0.2.pre wegen flutter/flutter#192231 (siehe ci.yml, #453).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.49.0-0.2.pre'
          channel: 'beta'
          cache: true

      # Ein RevenueCat-Test-Store-Key (`test_...`) lässt im Release-Build
      # Purchases.configure scheitern und die App abstürzen (#454, #455).
      - name: Check RevenueCat key
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_PROD_KEY }}
        run: |
          if [ -z "$RC_ANDROID_KEY" ]; then
            echo "::error::Secret RC_ANDROID_PROD_KEY ist leer oder fehlt – ohne Key startet RevenueCat nicht."
            exit 1
          fi
          case "$RC_ANDROID_KEY" in
            test_*)
              echo "::error::RC_ANDROID_PROD_KEY ist ein Test-Store-Key (test_...). Für den Release-Build den Play-Store-Key (goog_...) aus dem RevenueCat-Dashboard hinterlegen."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Keystore ist leer oder fehlt – ANDROID_KEYSTORE_BASE64 prüfen!"
            exit 1
          fi

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Build Production AAB
        env:
          ORG_GRADLE_PROJECT_android.signing.storeFile: release.keystore
          ORG_GRADLE_PROJECT_android.signing.storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.signing.keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.signing.keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=$(( ${{ github.run_number }} + 1393 )) \
            --dart-define=API_URL="https://api.work-time-manager.app" \
            --dart-define=RC_ANDROID_KEY="${{ secrets.RC_ANDROID_PROD_KEY }}" \
            --dart-define=RECAPTCHA_SITE_KEY="${{ secrets.RECAPTCHA_SITE_KEY }}"

      # Native Debug-Symbole (#469): debugSymbolLevel in android/app/build.gradle legt sie im AAB ab.
      - name: Check native debug symbols in AAB
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          if unzip -l "$AAB" | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'; then
            echo "Native Debug-Symbole sind im AAB enthalten."
          else
            echo "::warning::Keine native Debug-Symbole im AAB (BUNDLE-METADATA/com.android.tools.build.debugsymbols) - debugSymbolLevel in android/app/build.gradle pruefen (#469)."
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-production-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Diagnose (#467): zusammengefuehrte R8-Regeln samt Herkunft, Seeds und entfernter Code.
      - name: Upload R8 diagnostics Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-r8-diagnostics-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/mapping/release/configuration.txt
            mobile/build/app/outputs/mapping/release/seeds.txt
            mobile/build/app/outputs/mapping/release/usage.txt
          if-no-files-found: warn
          retention-days: 30

      # R8-Guard (#467): `-dontoptimize` in der zusammengefuehrten Konfiguration schaltet die
      # Optimierung fuer die ganze App ab (Play Vitals: 0 %). Bekannte Quelle war die
      # Consumer-Regel von purchases-store-amazon (transitiv ueber purchases_flutter).
      - name: Guard - R8 optimization must not be disabled
        run: |
          CONFIG=build/app/outputs/mapping/release/configuration.txt
          if [ ! -s "$CONFIG" ]; then
            echo "::error::$CONFIG fehlt oder ist leer - R8 lief nicht (minifyEnabled?)."
            exit 1
          fi
          if grep -n -E '^[[:space:]]*-dontoptimize' "$CONFIG"; then
            echo "::error::-dontoptimize in $CONFIG - eine Consumer-Regel schaltet die R8-Optimierung ab (#467). Herkunft steht in den Kommentaren oberhalb des Treffers (Artefakt r8-diagnostics); bekannter Verursacher purchases-store-amazon (Exclude in android/app/build.gradle)."
            exit 1
          fi
          echo "Kein -dontoptimize in der R8-Konfiguration."

      # Die Play Console bietet die mapping.txt nur zum Hochladen/Löschen an. Zum
      # Auflösen obfuskierter Namen (z. B. `z2` in #453) hier als Artefakt ablegen.
      - name: Upload R8 mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-time-manager-mapping-${{ github.run_number }}
          path: mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # Nur beim echten Release über main hochladen. Ein manueller Testlauf
      # (workflow_dispatch) baut das AAB, veröffentlicht es aber nicht.
      - name: Upload to Google Play (Closed Testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: app.work_time_manager
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.release_name.outputs.name }}
          track: ${{ steps.release_name.outputs.track }}
          status: completed
          whatsNewDirectory: mobile/whatsnew

  # Synchronisiert Titel, Kurz- und Langbeschreibung (de-DE & en-US) aus
  # fastlane/metadata/android automatisch nach jedem Release auf main (oder
  # einzeln per workflow_dispatch mit sync_store_metadata=true ohne AAB-Rebuild).
  sync-metadata:
    name: Sync Store Metadata to Google Play
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_store_metadata)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Store Listings via Google Play Android Publisher API
        working-directory: .
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const packageName = 'app.work_time_manager';
          const metadataRoot = 'fastlane/metadata/android';
          const sa = JSON.parse(process.env.PLAY_STORE_JSON_KEY);

          function b64url(input) {
            return Buffer.from(input).toString('base64url');
          }

          async function getAccessToken() {
            const now = Math.floor(Date.now() / 1000);
            const tokenUri = sa.token_uri || 'https://oauth2.googleapis.com/token';
            const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const claim = b64url(JSON.stringify({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: tokenUri,
              iat: now,
              exp: now + 3600,
            }));
            const sign = crypto.createSign('RSA-SHA256');
            sign.update(`${header}.${claim}`);
            const jwt = `${header}.${claim}.${sign.sign(sa.private_key, 'base64url')}`;

            const res = await fetch(tokenUri, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: jwt,
              }),
            });
            if (!res.ok) {
              throw new Error(`OAuth token error (${res.status}): ${await res.text()}`);
            }
            const data = await res.json();
            return data.access_token;
          }

          async function syncListings(token, changesNotSentForReview = false) {
            const baseUrl = `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${packageName}/edits`;
            const headers = {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            };

            const createRes = await fetch(baseUrl, { method: 'POST', headers, body: '{}' });
            if (!createRes.ok) {
              throw new Error(`Create edit failed (${createRes.status}): ${await createRes.text()}`);
            }
            const { id: editId } = await createRes.json();
            console.log(`Created Google Play edit: ${editId}`);

            const langs = fs.readdirSync(metadataRoot).filter((d) =>
              fs.statSync(path.join(metadataRoot, d)).isDirectory()
            );

            for (const lang of langs) {
              const dir = path.join(metadataRoot, lang);
              const title = fs.readFileSync(path.join(dir, 'title.txt'), 'utf8').trim();
              const shortDescription = fs.readFileSync(path.join(dir, 'short_description.txt'), 'utf8').trim();
              const fullDescription = fs.readFileSync(path.join(dir, 'full_description.txt'), 'utf8').trim();

              const putRes = await fetch(`${baseUrl}/${editId}/listings/${lang}`, {
                method: 'PUT',
                headers,
                body: JSON.stringify({
                  language: lang,
                  title,
                  shortDescription,
                  fullDescription,
                }),
              });
              if (!putRes.ok) {
                throw new Error(`Update listing ${lang} failed (${putRes.status}): ${await putRes.text()}`);
              }
              console.log(`Updated store listing for ${lang} ("${title}")`);
            }

            const commitUrl = `${baseUrl}/${editId}:commit${changesNotSentForReview ? '?changesNotSentForReview=true' : ''}`;
            const commitRes = await fetch(commitUrl, { method: 'POST', headers });
            if (!commitRes.ok) {
              const body = await commitRes.text();
              const err = new Error(`Commit edit failed (${commitRes.status}): ${body}`);
              err.status = commitRes.status;
              err.body = body;
              throw err;
            }
            console.log(`Committed Google Play edit ${editId} (changesNotSentForReview=${changesNotSentForReview})`);
          }

          (async () => {
            const token = await getAccessToken();
            try {
              await syncListings(token, false);
            } catch (err) {
              if (err.status === 400 && err.body && err.body.includes('changesNotSentForReview')) {
                console.warn('Standard commit requires changesNotSentForReview=true, retrying...');
                await syncListings(token, true);
              } else if (err.status === 403) {
                console.error(
                  `::error::Google Play API 403 PERMISSION_DENIED beim Speichern der Store-Texte. ` +
                  `Dem Service-Account (${sa.client_email}) fehlt in der Google Play Console unter ` +
                  `"Nutzer und Berechtigungen -> App-Berechtigungen" der Haken bei ` +
                  `"Präsenz im Play Store verwalten" (Manage store presence).`
                );
                process.exit(1);
              } else {
                throw err;
              }
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

