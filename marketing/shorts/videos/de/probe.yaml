# Probevideo für die Pipeline (#575, S1): Platzhalterbild statt App-Bild, wird nicht veröffentlicht.
# Zeigt jeden Baustein einmal. Aufbau der Felder: README.md, „Videobeschreibung“.
id: probe
titel: Probe der Bausteine

# Benannte Rechtecke im Bild, als Anteil von Breite und Höhe (0 bis 1).
ausschnitte:
  mitte: { x: 0.1, y: 0.39, breite: 0.8, hoehe: 0.16 }
  knopf: { x: 0.1, y: 0.578, breite: 0.8, hoehe: 0.078 }

szenen:
  - art: aufhaenger
    text: Läuft die Probe durch?
    saetze:
      - Läuft die Probe durch?

  - art: app
    bild: platzhalter.png
    zoom: { auf: knopf, faktor: 1.3 }
    tipp: { auf: knopf, bei: 0.6 }
    saetze:
      - Dieses Bild ist ein Platzhalter, die Länge der Szene kommt aus dem Ton.
      - Um 16:40 Uhr steht der Saldo bei +12:45 Stunden.

  - art: app
    bild: platzhalter.png
    zoom: { auf: mitte }
    einblendung: Texteinblendung über dem Bild
    premium: true
    saetze:
      - So sieht eine Szene mit Premium-Kennzeichen aus.

  - art: teaser
    text: Hier steht später ein Ausblick.
    dauer: 2

  - art: schluss
